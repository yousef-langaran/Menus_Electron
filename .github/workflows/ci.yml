name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        # Native modules (serialport, node-hid, usb) are not needed for type-check/tests.
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Type-check (renderer)
        run: yarn type-check

      - name: Type-check (electron main process)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Unit tests
        run: yarn test
