name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to Server
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          sshpass -p $SERVER_PASSWORD ssh -o StrictHostKeyChecking=no $SERVER_USERNAME@$SERVER_IP << 'EOF'
            cd /root/Menus_Electron
            eval "$(ssh-agent -s)"
            ssh-add ~/gith
            git stash
            sudo -E git pull
            yarn install
            yarn build
            yarn dist:win
          EOF

      - name: Download exe from Server
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          mkdir -p release-artifact
          # مسیر exe روی سرور (نام فایل شامل فاصله است)
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no \
            "$SERVER_USERNAME@$SERVER_IP:/root/Menus_Electron/release/Menus Order Manager Setup 1.0.0.exe" \
            ./release-artifact/ || true

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Menus-Order-Manager-Setup-Windows
          path: release-artifact/
          if-no-files-found: warn
