name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to Server
        env:
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          sshpass -p $SERVER_PASSWORD ssh -o StrictHostKeyChecking=no $SERVER_USERNAME@$SERVER_IP << 'EOF'
            cd Menus_Electron
            eval "$(ssh-agent -s)"
            ssh-add ~/gith
            git stash
            sudo -E git pull
            yarn install
            yarn build
            yarn dist:win
            EXE=$(ls release/*.exe 2>/dev/null | head -1)
            if [ -n "$EXE" ]; then
              mkdir -p ../Menus_FE/public/downloads
              cp "$EXE" ../Menus_FE/public/downloads/menus-electron-setup-latest.exe
            fi
          EOF